###############################################################################

include:
  - project: 'bitservices/gitlab/packer'
    ref: latest
    file: '/templates/aws/core.yml'
    inputs:
      name: archlinux64
      architecture: arm64

###############################################################################

test:
  variables:
    PKR_VAR_bucket: test-s3-bucket

###############################################################################

build:
  before_script:
    - !reference [before_script]
    - test -n "${PKR_VAR_bucket}"

###############################################################################
