###############################################################################

include:
  - project: 'bitservices/gitlab/packer'
    ref: latest
    file: '/templates/aws.yml'

###############################################################################

variables:
  PACKER_NAME: archlinux64

###############################################################################

test:
  variables:
    PKR_VAR_bucket: bucket

###############################################################################

build:
  before_script:
    - !reference [before_script]
    - test -n "${PKR_VAR_bucket}"

###############################################################################
