##
### Arch Linux cloud.cfg - This config enables Archlinux tested/compatible cloud-init modules.
##

################################################################################

disable_root     : true
preserve_hostname: false
resize_rootfs    : true

################################################################################

ssh_pwauth     :   no
ssh_genkeytypes: [ 'ed25519' ]

################################################################################

cloud_init_modules:

  - seed_random
  - growpart
  - resizefs
  - bootcmd
  - write-files
  - mounts
  - set_hostname
  - update_hostname
  - users-groups
  - ssh

################################################################################

cloud_config_modules:

  - set-passwords
  - runcmd

################################################################################

cloud_final_modules:

  - rightscale_userdata
  - scripts-per-once
  - scripts-per-boot
  - scripts-per-instance
  - scripts-user
  - ssh-authkey-fingerprints
  - keys-to-console
  - final-message

################################################################################

syslog_fix_perms: root:log

################################################################################

system_info:

  distro      : arch
  default_user:

    name       :   archlinux
    gecos      :   Archlinux
    groups     : [ "adm", "audio", "floppy", "users", "uucp", "video", "wheel" ]
    sudo       : [ "ALL=(ALL) NOPASSWD:ALL"                                    ]
    shell      :   /usr/bin/bash
    lock_passwd:   true

  paths:

    cloud_dir    : /var/lib/cloud/
    templates_dir: /etc/cloud/templates/

  ssh_svcname: sshd

################################################################################

users:

  - default

################################################################################

datasource_list: [ Ec2, None]

################################################################################

network:

  config: disabled

################################################################################
